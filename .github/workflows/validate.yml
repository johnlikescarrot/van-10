name: Build and check PDF
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - run: python scripts/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: de-cuong-ngu-van-10
          path: DE_CUONG_ON_TAP_GIUA_KI_1_NGU_VAN_10_KNTT_2026_2027.pdf
